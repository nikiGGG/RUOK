# ============================================================================
# RUOK CI — required backend matrix (WP10 / T037).
#
# Gates BOTH database backends with the same behavioural contract suite:
#   - SQLite (default, no service)
#   - PostgreSQL 16 and PostgreSQL 17 (real server services)
#
# Both backends are REQUIRED gates: no matrix entry, test step or build step is
# allowed to fail (`continue-on-error` is never set on a test/build step, and
# the build/check/test jobs are all required to be green before merge).
#
# Requires (repo-root layout):
#   - The SvelteKit/TypeScript app lives in `okr-app/` (package.json, lockfile,
#     Dockerfile). All `run` steps execute with working-directory `okr-app`.
#   - `okr-app/package-lock.json` is committed so `npm ci` is reproducible.
#
# ACTION PINNING POLICY
# ---------------------
# Third-party actions are pinned to immutable commit SHAs (never mutable major
# tags). The SHAs below were recorded at authoring time from the upstream
# releases listed in the comments. BEFORE first production run, verify each SHA
# resolves to the intended tag (e.g. `git ls-remote` against the action repo,
# or the Marketplace) and update to the current reviewed SHA if any recorded
# value is not present. This is an apply-time prerequisite, not a runtime step.
# ============================================================================

name: RUOK CI

on:
  push:
    branches:
      - main
      - master
      - 'plan/**'
  pull_request:

concurrency:
  group: ruok-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-read default for the whole workflow. No job here needs packages:write
# or any push/registry capability — publication lives in ruok-image.yml.
permissions:
  contents: read

env:
  NODE_VERSION: '22' # matches the node:22-alpine production image (Dockerfile)

defaults:
  run:
    working-directory: okr-app

jobs:
  # ---------------------------------------------------------------------------
  # build-check — one required gate that proves the app compiles and builds.
  # `npm run check` has a DOCUMENTED PRE-EXISTING BASELINE of 18 errors /
  # 4 warnings in unchanged `src/` UI files (see okr-app/docs/DATABASE-
  # VERIFICATION.md, WP08). Those files are NOT modified by this persistence/
  # CI mission, so the check step runs non-blocking with an explicit TODO.
  # This does NOT relax any backend gate: build and every test job below are
  # hard required checks.
  # ---------------------------------------------------------------------------
  build-check:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node (pinned + npm cache)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: okr-app/package-lock.json

      - name: Reproducible install from lockfile
        run: npm ci

      - name: Type-check (pre-existing UI baseline is non-blocking)
        # TODO: make this a required gate once the pre-existing `src/` baseline
        # (18 errors / 4 warnings, see DATABASE-VERIFICATION.md WP08) is fixed.
        continue-on-error: true
        run: npm run check

      - name: Production build (SvelteKit / adapter-node)
        run: npm run build

  # ---------------------------------------------------------------------------
  # test-sqlite — required backend gate for the default SQLite path.
  # Runs the full required suite (`npm test`) plus the SQLite contract matrix
  # (`npm run test:db:sqlite`). Never allowed to fail.
  # ---------------------------------------------------------------------------
  test-sqlite:
    name: Backend SQLite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node (pinned + npm cache)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: okr-app/package-lock.json

      - name: Reproducible install from lockfile
        run: npm ci

      - name: Required suite (npm test)
        # Output is captured so redacted failure evidence can be uploaded.
        # vitest does not print connection strings / env, so logs are safe.
        run: npm test 2>&1 | tee "$RUNNER_TEMP/ci-sqlite-test.log"

      - name: SQLite contract matrix (npm run test:db:sqlite)
        run: npm run test:db:sqlite 2>&1 | tee -a "$RUNNER_TEMP/ci-sqlite-test.log"

      - name: Upload SQLite test evidence (on failure only)
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8a75a5a1e # v4.4.3
        with:
          name: ci-sqlite-test-log
          path: ${{ runner.temp }}/ci-sqlite-test.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # test-postgres — required backend gates for PostgreSQL 16 and 17.
  # Each matrix entry starts a REAL PostgreSQL server as a service and points
  # the real-backend suites at it via RUOK_TEST_PG_ADMIN_URL (the `postgres`
  # superuser owns CREATEDB, which the fixtures use to create a disposable
  # database per test). `fail-fast: false` so one PG version failing never
  # cancels the other. Neither entry is allowed to fail.
  # ---------------------------------------------------------------------------
  test-postgres:
    name: Backend PostgreSQL ${{ matrix.pg-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg-version: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Health-gate the service so tests only start once the server accepts
        # connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_BACKEND: postgres
      RUOK_TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node (pinned + npm cache)
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: okr-app/package-lock.json

      - name: Reproducible install from lockfile
        run: npm ci

      - name: PostgreSQL contract matrix (npm run test:db:postgres)
        # Output is captured for redacted failure evidence (no secrets echoed).
        run: npm run test:db:postgres 2>&1 | tee "$RUNNER_TEMP/ci-pg${{ matrix.pg-version }}-test.log"

      - name: Upload PostgreSQL test evidence (on failure only)
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8a75a5a1e # v4.4.3
        with:
          name: ci-pg${{ matrix.pg-version }}-test-log
          path: ${{ runner.temp }}/ci-pg${{ matrix.pg-version }}-test.log
          if-no-files-found: warn